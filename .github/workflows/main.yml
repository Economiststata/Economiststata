name: Recent Activity Workflow
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write # Esto le da permiso explícito para leer y escribir archivos

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Actualizar README
        uses: Readme-Workflows/recent-activity@v2.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        with:
          # Forzamos los nombres de las etiquetas por si acaso
          INITIAL_DATA: ""
